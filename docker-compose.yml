version: "3.9"

.app-environment: &app-environment
  PG_HOST: "${PG_HOST}"
  PG_PORT: "${PG_PORT}"
  PG_USERNAME: "${PG_USERNAME}"
  PG_PASSWORD: "${PG_PASSWORD}"
  PG_DB: "${PG_DB}"
  SERVER_PORT: "${SERVER_PORT}"
  LOG_LEVEL: "${LOG_LEVEL}"
  LOG_DEVELOPMENT: "${LOG_DEVELOPMENT}"
  LOG_ENCODDING: "${LOG_ENCODDING}"

services:
  go_server:
    # pid: 'host'
    # platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *app-environment
    # env_file: ./backend/.env
    image: go_app
    container_name: "server"
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internet

  db:
    image: postgres:16
    container_name: "db_postgres"
    ports:
      - "${PG_PORT}:${PG_PORT}"
    environment:
      POSTGRES_PASSWORD: "${PG_PASSWORD}"
      POSTGRES_USER: "${PG_USERNAME}"
      POSTGRES_DB: "${PG_DB}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
      # - ./new_db.sql:/docker-entrypoint-initdb.d/new_database.sql # init db schema
    networks:
      - internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USERNAME} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  internet:
    name: internet
    driver: bridge
