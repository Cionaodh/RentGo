version: '3.9'

x-backend-app-environment: &x-backend-app-environment
  GOMAXPROCS: '1'
  # App
  APP_NAME: 'RentGo'
  APP_VERSION: '1.0.0'
  # HTTP settings
  HTTP_PORT: '8080'
  HTTP_USE_PREFORK_MODE: 'false'
  # Logger
  LOG_LEVEL: 'debug'

services:
  app:
    container_name: app
    platform: linux/amd64
    pid: 'host'
    build:
      context: ./backend
    environment:
      <<: *x-backend-app-environment
    ports:
      - '8080:8080'
      - '8081:8081'
